<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fix Local AI - Early Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #9C27B0;
      --primary-dark: #7B1FA2;
      --secondary: #88B0FF;
      --light: #F5F5F5;
      --dark: #333333;
      --success: #4CAF50;
      --error: #F44336;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Roboto', sans-serif;
      line-height: 1.6;
      color: var(--dark);
      background-color: var(--light);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 650px;
      margin: 0 auto;
    }
    
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    h1 {
      color: var(--primary);
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: var(--dark);
      font-size: 1.1rem;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.5;
    }
    
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      padding: 32px;
      margin-bottom: 24px;
      transition: transform 0.3s ease;
    }
    
    .card:hover {
      transform: translateY(-5px);
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    input[type="email"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
      background: #f9f9f9;
    }
    
    input[type="email"]:focus {
      border-color: var(--primary);
      outline: none;
      background: white;
    }
    
    button {
      background: var(--primary);
      color: white;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 6px rgba(156, 39, 160, 0.25);
    }
    
    button:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 8px rgba(156, 39, 160, 0.3);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .success-message, .error-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      max-width: 80%;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .success-message.show {
      opacity: 1;
      background: rgba(76, 175, 80, 0.95);
      color: white;
      border: 1px solid rgba(76, 175, 80, 0.8);
    }
    
    .error-message.show {
      opacity: 1;
      background: rgba(244, 67, 54, 0.95);
      color: white;
      border: 1px solid rgba(244, 67, 54, 0.8);
    }
    
    .footer {
      text-align: center;
      color: var(--dark);
      font-size: 0.9rem;
      margin-top: 20px;
    }
    
    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
      }
      
      .card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Fix Local AI</h1>
      <p class="subtitle">Join our early access program to get the latest features before they're public. We'll send you updates and special offers.</p>
    </header>
    
    <div class="card">
      <form id="signup-form">
        <div class="form-group">
          <input type="email" id="email" placeholder="Your email address" required>
        </div>
        <button type="submit">
          <svg xmlns="http://www.w3.org/2</svg>
          Get Early Access
        </button>
      </form>
      
      <div id="success-message" class="success-message">Thank you! You'll receive an email within 24 hours.</div>
      <div id="error-message" class="error-message">Please enter a valid email address.</div>
    </div>
    
    <div class="footer">
      <p>By joining, you agree to our <a href="#" style="color: var(--primary);">Privacy Policy</a> and <a href="#" style="color: var(--primary);">Terms of Service</a></p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signup-form');
      const emailInput = document.getElementById('email');
      const successMessage = document.getElementById('success-message');
      const errorMessage = document.getElementById('error-message');
      
      // Form validation
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        if (!emailInput.value || !/^\S+@\S+\.\S+$/.test(emailInput.value)) {
          errorMessage.classList.add('show');
          setTimeout(() => errorMessage.classList.remove('show'), 3000);
          return;
        }
        
        // Replace with your actual Supabase endpoint
        const supabaseUrl = 'https://your-supabase-project.supabase.co';
        const supabaseKey = 'your-supabase-key';
        
        fetch(`${supabaseUrl}/rest/v1/early-access`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${supabaseKey}`
          },
          body: JSON.stringify({
            email: emailInput.value
          })
        })
        .then(response => {
          if (response.ok) {
            successMessage.classList.add('show');
            emailInput.value = '';
            setTimeout(() => successMessage.classList.remove('show'), 3000);
          } else {
            errorMessage.classList.add('show');
            setTimeout(() => errorMessage.classList.remove('show'), 3000);
          }
        })
        .catch(error => {
          console.error('Error:', error);
          errorMessage.classList.add('show');
          setTimeout(() => errorMessage.classList.remove('show'), 3000);
        });
      });
      
      // Email input focus effect
      emailInput.addEventListener('focus', () => {
        emailInput.parentElement.style.borderColor = 'var(--primary)';
      });
      
      emailInput.addEventListener('blur', () => {
        if (emailInput.value) {
          emailInput.parentElement.style.borderColor = '#e0e0e0';
        }
      });
    });
  </script>
</body>
</html>
